placeholder:
  resolve:
    # Maximum nesting depth while resolving placeholders.
    # Protects against infinite recursion (e.g. A -> B -> A) and overly deep chains.
    max-depth: 16

    # Maximum number of "%token%" occurrences processed per input string.
    # Protects against extremely large inputs or abusive configurations.
    max-tokens-per-input: 4096

  cache:
    # Upper bound for cache entries (across all placeholders and scopes).
    # Higher = fewer recomputations but more RAM; lower = less RAM but more CPU.
    max-cache-entries: 100000